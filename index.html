<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talha Keskin — SNAP JAM</title>
    <style>
      :root {
        --bg: #f6f2ea;
        --card: #ffffff;
        --ink: #1e293b;
        --muted: #64748b;
        --accent: #2e7cf6;
        --border: #e2d9c8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        box-sizing: border-box;
      }
      main {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 22px;
        padding: 32px 26px;
        box-shadow: 0 8px 0 rgba(203, 191, 167, 0.55);
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: #eef2ff;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 15px;
      }
      .card {
        background: #faf7f0;
        border: 1.5px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 22px;
      }
      .card h2 {
        margin: 0 0 4px;
        font-size: 20px;
        color: var(--ink);
      }
      .card p {
        margin: 0;
        font-size: 14px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      a.btn {
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        border: 1.5px solid var(--border);
        color: var(--ink);
        background: #ffffff;
      }
      a.btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Indie Game Developer</span>
      <h1>Talha Keskin</h1>
      <p>Clean, tactile puzzle games crafted for quick, satisfying play sessions.</p>

      <div class="card">
        <h2>SNAP JAM</h2>
        <p>Arrow &amp; Tile Match Puzzle — coming to Google Play.</p>
      </div>

      <div class="links">
        <a class="btn primary" href="./privacy-policy.html">Privacy Policy / Gizlilik Politikası</a>
        <a class="btn" href="mailto:talha.keskin1@outlook.com">Contact Support</a>
      </div>
    </main>
  </body>
</html>
